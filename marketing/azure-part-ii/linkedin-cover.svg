<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Same question. Different clearance. Part II</title>
  <desc id="desc">An industrial-style editorial cover showing one query splitting into two outcomes, cited source visible and no documents.</desc>
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#abd3ce" stroke-opacity=".13" stroke-width="1"/>
    </pattern>
    <pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M0 0V14" stroke="#ff9d79" stroke-width="4" stroke-opacity=".32"/>
    </pattern>
    <radialGradient id="wash" cx="75%" cy="37%" r="74%">
      <stop stop-color="#234747"/><stop offset="1" stop-color="#101c1f"/>
    </radialGradient>
    <style>
      .mono{font-family:Menlo,'Courier New',monospace;font-weight:700;letter-spacing:3px}
      .display{font-family:Baskerville,Georgia,serif;font-weight:700}
      .sans{font-family:'Avenir Next','Helvetica Neue',sans-serif;font-weight:500}
    </style>
  </defs>
  <path fill="url(#wash)" d="M0 0h1920v1080H0z"/>
  <path fill="url(#grid)" d="M1080 0h840v1080h-840z"/>
  <path d="M112 110h1696M112 946h1696" stroke="#74958e" stroke-width="2"/>
  <path d="M112 110h116" stroke="#e8c86f" stroke-width="6"/>
  <g class="mono" font-size="24" fill="#add2c6">
    <text x="112" y="169">THREE CLOUDS / FIELD NOTES</text>
    <text x="1808" y="169" text-anchor="end">AZURE / PART II</text>
    <text x="112" y="1006">JEREMIAH WILLIAMS</text>
    <text x="1808" y="1006" text-anchor="end">NOV 2026</text>
  </g>
  <text class="display" x="102" y="359" font-size="146" fill="#faf2dc" letter-spacing="-5">Same question.</text>
  <text class="display" x="102" y="512" font-size="146" fill="#e8c86f" letter-spacing="-5">Different</text>
  <text class="display" x="102" y="665" font-size="146" fill="#e8c86f" letter-spacing="-5">clearance.</text>
  <path d="M113 734h72" stroke="#e8c86f" stroke-width="4"/>
  <text class="sans" x="112" y="802" font-size="40" fill="#e1ebe0">What the Azure agent could retrieve,</text>
  <text class="sans" x="112" y="853" font-size="40" fill="#e1ebe0">what it remembered, and what it refused.</text>
  <g transform="translate(1260 236) rotate(4 228 327)">
    <path d="M24 24h456v652H24z" fill="#0c1517" opacity=".8"/>
    <rect width="456" height="652" rx="8" fill="#152728" stroke="#709a91" stroke-width="2"/>
    <path d="M18 18h420v616H18z" fill="none" stroke="#709a91" stroke-opacity=".34"/>
    <g fill="#73958d">
      <circle cx="18" cy="18" r="5"/><circle cx="438" cy="18" r="5"/>
      <circle cx="18" cy="634" r="5"/><circle cx="438" cy="634" r="5"/>
    </g>
    <g class="mono" font-size="20" fill="#b9d1c5">
      <text x="42" y="61">RETRIEVAL / ACCESS</text>
      <text x="414" y="61" text-anchor="end">02</text>
    </g>
    <path d="M42 84h372" stroke="#709a91" stroke-width="2"/>
    <rect x="112" y="124" width="232" height="87" rx="44" fill="#ebcc77"/>
    <text class="mono" x="228" y="178" font-size="25" fill="#182627" text-anchor="middle">ONE QUERY</text>
    <path d="M228 211v62M228 273H68v64" fill="none" stroke="#9ce3ce" stroke-width="4"/>
    <path d="M228 273h160v197" fill="none" stroke="#ff9d79" stroke-width="4" stroke-dasharray="9 7"/>
    <circle cx="228" cy="273" r="8" fill="#f3d37e"/>
    <rect x="42" y="337" width="372" height="104" rx="5" fill="#264841" stroke="#9ce3ce" stroke-width="2"/>
    <rect x="42" y="470" width="372" height="104" rx="5" fill="#302b28" stroke="#ff9d79" stroke-width="2"/>
    <rect x="386" y="471" width="27" height="102" fill="url(#hatch)"/>
    <g class="mono" font-size="21">
      <text x="65" y="373" fill="#a6e9d5">01 / ALLOWED</text>
      <text x="65" y="505" fill="#ffb99b">02 / DENIED</text>
    </g>
    <g class="sans" font-size="28" fill="#faf2dc">
      <text x="65" y="413">Cited source visible</text>
      <text x="65" y="545">No documents</text>
    </g>
    <path d="m353 384 11 11 23-26" fill="none" stroke="#9ce3ce" stroke-width="5"/>
    <path d="M351 525h27" stroke="#ff9d79" stroke-width="5"/>
    <text class="mono" x="42" y="616" font-size="17" fill="#bdd0c5">PERMISSIONS APPLY AT QUERY TIME</text>
  </g>
</svg>
